<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title-dv200 desc-dv200">
  <title id="title-dv200">Dosificadora Volumétrica DV-200 (DEMO)</title>
  <desc id="desc-dv200">Esquema técnico ilustrativo de dosificadora volumétrica de pistón con tolva superior y boquilla dosificadora.</desc>
  <defs>
    <pattern id="grid-dv" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#223242" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="#14202B"/>
  <rect width="640" height="360" fill="url(#grid-dv)"/>
  <rect x="16" y="16" width="608" height="328" fill="none" stroke="#334B61" stroke-width="1.5"/>

  <!-- Base & column -->
  <rect x="170" y="294" width="300" height="18" rx="2" fill="#475569" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="210" y="96" width="22" height="198" fill="#334155" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Support arm -->
  <rect x="232" y="138" width="150" height="18" fill="#475569" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Hopper -->
  <polygon points="295,54 395,54 365,124 325,124" fill="#1E293B" stroke="#E2E8F0" stroke-width="2.5"/>
  <rect x="290" y="46" width="110" height="10" rx="2" fill="#64748B" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Pneumatic piston cylinder -->
  <rect x="330" y="124" width="30" height="68" rx="3" fill="#1E3A5F" stroke="#7DD3FC" stroke-width="2"/>
  <line x1="345" y1="134" x2="345" y2="182" stroke="#7DD3FC" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Nozzle & container -->
  <rect x="339" y="192" width="12" height="28" fill="#94A3B8" stroke="#E2E8F0" stroke-width="1.5"/>
  <polygon points="341,220 349,220 347,232 343,232" fill="#F59E0B"/>
  <rect x="323" y="246" width="44" height="48" rx="4" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="326" y="266" width="38" height="25" rx="2" fill="#0EA5E9" fill-opacity="0.28"/>

  <!-- Control box -->
  <rect x="130" y="120" width="68" height="82" rx="4" fill="#1E293B" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="142" y="134" width="44" height="24" rx="2" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="150" cy="176" r="6" fill="#22C55E"/>
  <circle cx="172" cy="176" r="6" fill="#F59E0B"/>

  <!-- Dimension lines -->
  <line x1="440" y1="54" x2="440" y2="294" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="432" y1="54" x2="448" y2="54" stroke="#64748B" stroke-width="1.5"/>
  <line x1="432" y1="294" x2="448" y2="294" stroke="#64748B" stroke-width="1.5"/>
  <text x="452" y="178" fill="#94A3B8" font-family="monospace" font-size="12">H: 1450 mm</text>

  <!-- Technical label & DEMO watermark -->
  <text x="608" y="40" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="1.2">ESQUEMA ILUSTRATIVO</text>
  <text x="32" y="314" fill="#CBD5E1" font-family="monospace" font-size="12" letter-spacing="1.2">MOD. DV-200 // VOLUMÉTRICA</text>
  <text x="32" y="332" fill="#64748B" font-family="monospace" font-size="11">IMAGEN PLACEHOLDER DEMO — SIN ESCALA COMERCIAL</text>
</svg>
